# This file stores the flash_commands for each mcus
# Previous version KCONFIG_CONFIG was needed now it is automaticly added when make flash is called
# version : 0.2
# tested/supported flash methods :
#  - make flash
#  - sdcard_flash
#  - flashtool.py
#  - mount/cp/umount (for rp2040)
#  - external scripts ...

#[rpi]
#klipper_section: mcu rpi
#action_command: make flash

[M5P]
klipper_section: mcu
quiet_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -i can0 -r -u 946c2a3d1f60
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32g0b1xx_4F00320008504E5238363120-if00


[EBB36]
klipper_section: mcu EBBCan
action_command: ~/klippy-env/bin/python3 ~/katapult/scripts/flashtool.py -i can0 -u e203e6067b14
