[force_move] 
enable_force_move: true
[include sensorless.cfg]
[include macros/*.cfg]
[include mainsail.cfg]
# [include autotune_tmc.cfg]
[exclude_object]
[gcode_arcs]

[mcu host]
serial: /tmp/klipper_host_mcu
[mcu]
canbus_uuid: 946c2a3d1f60
[mcu EBBCan]
canbus_uuid: e203e6067b14

[servo servo_test]
pin: PC15
maximum_servo_angle: 360
# minimum_pulse_width: 0.0005  # 0.5ms
# maximum_pulse_width: 0.0025  # 2.5ms

# [filament_motion_sensor my_sensor]
# detection_length: 7.0
# #   The minimum length of filament pulled through the sensor to trigger
# #   a state change on the switch_pin
# #   Default is 7 mm.
# extruder: extruder
# #   The name of the extruder or extruder_stepper section this sensor
# #   is associated with. This parameter must be provided.
# switch_pin: PC2
# #pause_on_runout:
# #runout_gcode:
# #insert_gcode:
# #event_delay:
# #pause_delay:
# #   See the "filament_switch_sensor" section for a description of the
# #   above parameters.



[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 8000
max_z_velocity: 100
max_z_accel: 500

# Motor Configuration ----------------------------------------- # 
# B Motor
[stepper_x] 
step_pin: PC8
dir_pin: PC9
enable_pin: !PA15
endstop_pin: tmc2209_stepper_x:virtual_endstop
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
position_endstop: 132
position_max: 132
position_min: -13
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_x]
uart_pin: PD9
diag_pin: ^PD3
run_current: 0.9
interpolate: False
stealthchop_threshold: 1# 999999
driver_SGTHRS: 87


# A Motor
[stepper_y] 
step_pin: PA10
dir_pin: PA14
enable_pin: !PA13
endstop_pin: tmc2209_stepper_y:virtual_endstop
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
position_endstop: 117
position_max: 117
position_min: 0
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: True

[tmc2209 stepper_y]
uart_pin: PD8
diag_pin: ^PD2
run_current: 0.9
interpolate: False
stealthchop_threshold: 1# 999999
driver_SGTHRS: 90

# Front Left
[stepper_z]
step_pin: PB0
dir_pin: !PB1
enable_pin: !PC4
microsteps: 16
rotation_distance: 32
# microsteps: 128
# rotation_distance: 32
full_steps_per_rotation: 200
# endstop_pin: EBBCan:PB6
endstop_pin: probe:z_virtual_endstop
# position_endstop: 0
# position_min: -5
position_max: 110 #105 For Hammer-Head
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PA6
run_current: 0.6
interpolate: False
stealthchop_threshold: 999999


# Rear
[stepper_z1]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PB10
run_current: 0.6
interpolate: False
stealthchop_threshold: 999999


# Front Right
[stepper_z2]
step_pin: PB12
dir_pin: PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: PB2
run_current: 0.6
interpolate: False
stealthchop_threshold: 999999


# Bed Configuration ------------------------------------------- #
[heater_bed]
heater_pin: PA5
sensor_pin: PA0
sensor_type: Generic 3950
min_temp: 0
max_temp: 120
#control: pid
#pid_Kp: 69.433
#pid_Ki: 1.126
#pid_Kd: 1070.171


# Toolhead Configuration -------------------------------------- #
[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: EBBCan: PD0
dir_pin: !EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
gear_ratio: 50:17
full_steps_per_rotation: 200
rotation_distance: 13.00068
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
min_extrude_temp: 0
max_extrude_only_distance: 250

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.35
stealthchop_threshold: 999999

[fan]
pin: EBBCan: PA1

[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0

[neopixel hotend_rgb]
pin: EBBCan:PD3
chain_count: 3

# Further Kinematic Configurartion ---------------------------- #
[z_tilt]
z_positions:
  -47.5,9.5
  60, 130.5
  167.5,9.5
points:
 30,10
 72,100
 115,10
speed: 80
horizontal_move_z: 25
retries: 3
retry_tolerance: 0.02


[bed_mesh]
mesh_min: 15,15
mesh_max: 105,105
speed: 100
horizontal_move_z: 20 

probe_count: 3,3					#if you would like more detail, use 5,5 here
# relative_reference_index: 4			 #if you use 5,5 above, place 12 here
move_check_distance: 3

algorithm: lagrange
fade_start: 1
fade_end: 10
fade_target: 0
split_delta_z: 0.0125
mesh_pps: 2,2


[probe]
pin: EBBCan:PB6
x_offset: -19.935
y_offset: 12.7
#z_offset: 14
speed: 7
lift_speed: 7

samples: 3
samples_result: median
sample_retract_dist: 2

samples_tolerance: 0.01
samples_tolerance_retries: 10

[resonance_tester]
probe_points: 60, 60, 20 
accel_chip: adxl345

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

[temperature_sensor EBB]
sensor_type: temperature_mcu
sensor_mcu: EBBCan

